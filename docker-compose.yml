

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=100.65.51.13:3000,192.168.88.248:3000,100.95.142.72:3000,localhost
      - TZ=America/Chicago
    restart: unless-stopped
